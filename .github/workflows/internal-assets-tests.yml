name: Internal equipment pool acceptance

on:
  pull_request:
    paths:
      - 'portal/app/internal_asset_models.py'
      - 'portal/app/routes_internal_assets.py'
      - 'portal/app/db.py'
      - 'portal/app/main.py'
      - 'portal/app/templates/resource_internal*.html'
      - 'portal/tests/test_internal_assets.py'
      - '.github/workflows/internal-assets-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'portal/app/internal_asset_models.py'
      - 'portal/app/routes_internal_assets.py'
      - 'portal/tests/test_internal_assets.py'

permissions:
  contents: read

jobs:
  internal-assets:
    name: "Gerätepool: Import, Datenbank und Buchungs-Integration"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: portal/requirements.txt
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt pytest
      - name: Syntax / Python-Importfähigkeit
        run: |
          python -m compileall -q app/internal_asset_models.py app/routes_internal_assets.py app/main.py
          python -m compileall -q tests/test_internal_assets.py
      - name: "Gerätepool: Integrations- und Sicherheitstests"
        run: python -m pytest -q tests/test_internal_assets.py
