name: Portal tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portal
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: portal/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run portal tests
        run: python -m pytest -q tests


  searxng-setup:
    name: SearXNG optional setup and Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check setup script and initialize optional profile
        run: |
          bash -n scripts/setup.sh
          cp .env.example .env
          ./scripts/setup.sh --enable-searxng
          grep -q '^SEARXNG_ENABLED=1$' .env
          grep -q '^COMPOSE_PROFILES=searxng$' .env
          initial_secret="$(grep '^SEARXNG_SECRET=' .env)"
          ./scripts/setup.sh --enable-searxng
          test "$initial_secret" = "$(grep '^SEARXNG_SECRET=' .env)"
          grep -q '^COMPOSE_PROFILES=searxng$' .env
          ./scripts/setup.sh --disable-searxng
          grep -q '^SEARXNG_ENABLED=0$' .env
          ./scripts/setup.sh --enable-searxng
      - name: Validate both Docker Compose modes
        run: |
          docker compose config --quiet
          docker compose --profile searxng config --quiet
      - name: Boot optional SearXNG container
        run: docker compose up -d searxng
      - name: Smoke-test SearXNG HTTP and JSON API
        run: |
          ready=0
          for i in {1..20}; do
            if docker compose exec -T searxng /usr/local/searxng/.venv/bin/python -c 'import urllib.request; assert urllib.request.urlopen("http://127.0.0.1:8080/", timeout=3).status == 200' 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          docker compose exec -T searxng /usr/local/searxng/.venv/bin/python -c 'import json,urllib.request; p=json.load(urllib.request.urlopen("http://127.0.0.1:8080/search?q=TAKT&format=json",timeout=25)); assert isinstance(p.get("results"),list)'
          # Docker unterscheidet EXPOSE (intern) von PortBindings (Host-Publishing).
          docker inspect "$(docker compose ps -q searxng)" | python -c 'import json,sys; assert not json.load(sys.stdin)[0]["HostConfig"]["PortBindings"], "SearXNG must not publish a host port"'
      - name: Diagnose failed startup
        if: failure()
        run: docker compose --profile searxng logs --tail=120 searxng
      - name: Stop test container
        if: always()
        run: docker compose --profile searxng down -v

  tasks-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: portal/requirements.txt
      - name: Install browser test dependencies
        run: python -m pip install -r requirements.txt playwright==1.62.0
      - name: Install Chromium headless shell (runner already includes browser OS libraries)
        run: python -m playwright install chromium --only-shell
      - name: Check file-picker feedback
        run: node tests/test_task_create_client.js
      - name: Verify visual knowledge-block Markdown round trips
        run: node tests/test_knowledge_blocks_client.js
      - name: Exercise knowledge block editor in Chromium
        run: python tests/browser/knowledge_blocks_smoke.py
      - name: Exercise task UI in Chromium
        run: python tests/browser/task_ui_smoke.py
      - name: Exercise agent confirmation across modules
        run: python tests/browser/agent_ui_smoke.py
      - name: Exercise passive digital signage in Chromium
        run: python tests/browser/signage_ui_smoke.py
      - name: Save browser screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tasks-browser
          path: portal/browser-artifacts/
          retention-days: 7

  surveys-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: portal/requirements.txt
      - name: Install browser test dependencies
        run: python -m pip install -r requirements.txt playwright==1.62.0
      - name: Install Chromium headless shell (runner already includes browser OS libraries)
        run: python -m playwright install chromium --only-shell
      - name: Check responsive cloud rendering
        run: node tests/test_live_chart_client.js
      - name: Exercise survey UI in Chromium
        run: python tests/browser/survey_ui_smoke.py
      - name: Save survey screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surveys-browser
          path: portal/survey-browser-artifacts/
          retention-days: 7

  seminars-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal
    env:
      SEMINAR_BROWSER_ARTIFACTS: /tmp/takt-seminar-browser
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: portal/requirements.txt
      - name: Install browser test dependencies
        run: python -m pip install -r requirements.txt playwright==1.62.0
      - name: Install Chromium headless shell (runner already includes browser OS libraries)
        run: python -m playwright install chromium --only-shell
      - name: Check seminar planner client contracts
        run: node tests/test_seminar_planner_client.js
      - name: Check module discovery and responsive navigation
        run: python tests/browser/navigation_ui_smoke.py
      - name: Check consistent navigation controls across modules
        run: python tests/browser/navigation_controls_smoke.py
      - name: Check organization memberships and scoped roles
        run: python tests/browser/organization_ui_smoke.py
      - name: Check theme selection in Chromium
        run: python tests/browser/theme_ui_smoke.py
      - name: Exercise seminar workflows on desktop and mobile
        run: python tests/browser/seminar_ui_smoke.py
      - name: Save seminar screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seminars-browser
          path: /tmp/takt-seminar-browser/
          retention-days: 7

  kanban-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up board UI build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/ui/package-lock.json
      - name: Verify bundled Mantine workspaces
        run: |
          npm ci --prefix ui
          npm run build --prefix ui
          git diff --exit-code -- app/static/board-ui.js app/static/board-ui.css app/static/board-ui.js.LEGAL.txt app/static/map-ui.js app/static/map-ui.css app/static/map-ui.js.LEGAL.txt app/static/vendor/mantine
          node tests/test_map_draw_client.js
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: portal/requirements.txt
      - name: Install browser test dependencies
        run: python -m pip install -r requirements.txt playwright==1.62.0
      - name: Install Chromium headless shell (runner already includes browser OS libraries)
        run: python -m playwright install chromium --only-shell
      - name: Exercise shared Kanban boards on desktop and touch mobile
        run: python tests/browser/board_ui_smoke.py
      - name: Save Kanban screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanban-browser
          path: /tmp/takt-board-browser/
          retention-days: 7

  calendars-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: portal/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt playwright==1.62.0
      - name: Install Chromium headless shell (runner already includes browser OS libraries)
        run: python -m playwright install chromium --only-shell
      - name: Check person timeline, keyboard, mobile and 150-person annual view
        run: python tests/browser/person_timeline_smoke.py
      - name: Check integrated leave and calendar forms
        run: python tests/browser/leave_ui_smoke.py
      - name: Save calendar and leave evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendars-browser
          path: /tmp/takt-*-*.png
          retention-days: 7
