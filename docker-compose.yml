# Jitsi Meet (self-hosted, JWT-Auth) + Jibri-Aufzeichnung + SpeechMind-Portal
#
# Aufbau:
#   caddy   – Reverse Proxy mit TLS (selbst signiert, Let's Encrypt per Admin-GUI) für MEET_DOMAIN und PORTAL_DOMAIN
#   web     – Jitsi-Meet-Frontend
#   prosody – XMPP-Server (JWT-Authentifizierung)
#   jicofo  – Konferenz-Fokus
#   jvb     – Videobridge (UDP 10000)
#   jibri   – Server-Aufzeichnung (liefert die Audiospur für SpeechMind)
#   portal  – Web-GUI: Login, Benutzer, Benachrichtigungen, Meetings, SpeechMind-Anbindung, Transkripte
#
# Alle Werte kommen aus .env (siehe .env.example bzw. scripts/setup.sh).

x-jitsi-common: &jitsi-common
  restart: ${RESTART_POLICY:-unless-stopped}
  env_file: .env
  security_opt:
    - no-new-privileges:true
  networks:
    meet.jitsi:

# Die Jitsi-Dienste lesen ihre Werte aus .env. Geheimnisse des Portals brauchen sie nicht – die werden in
# jedem Dienst unten wieder geleert (environment hat Vorrang vor env_file).

services:
  caddy:
    image: caddy:${CADDY_IMAGE_VERSION:-2.11.7}
    restart: ${RESTART_POLICY:-unless-stopped}
    security_opt:
      - no-new-privileges:true
    # Startet mit der Datei, die das Portal verwaltet (Admin > HTTPS & Zertifikat) und lädt sie
    # bei Änderungen selbst neu. Beim allerersten Start dient caddy/Caddyfile als Vorlage
    # (selbst signiertes Zertifikat). Das öffentliche Root-Zertifikat der internen CA wird regelmäßig nach
    # /conf kopiert – so muss das Portal den Datenordner mit den privaten Schlüsseln nicht einbinden.
    command:
      - sh
      - -c
      - "[ -f /conf/Caddyfile ] || cp /etc/caddy/Caddyfile /conf/Caddyfile; (while true; do cp -f /data/caddy/pki/authorities/local/root.crt /conf/root.crt 2>/dev/null; sleep 300; done) & exec caddy run --config /conf/Caddyfile --adapter caddyfile --watch"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - MEET_DOMAIN
      - PORTAL_DOMAIN
      - ACME_EMAIL
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CONFIG}/caddy/conf:/conf
      - ${CONFIG}/caddy/data:/data
      - ${CONFIG}/caddy/config:/config
    depends_on:
      - web
      - portal
    networks:
      meet.jitsi:

  web:
    <<: *jitsi-common
    image: jitsi/web:${JITSI_IMAGE_VERSION:-stable-11031}
    environment:
      - PORTAL_SECRET_KEY=
      - PORTAL_ADMIN_PASSWORD=
      # TLS macht Caddy, der Container spricht nur HTTP.
      - DISABLE_HTTPS=1
      # Ohne Gast-Domain: wer keinen Token hat, verbindet sich direkt (Räume ohne Anmeldung)
      - ENABLE_GUESTS=0
      - ENABLE_HTTP_REDIRECT=0
      - ENABLE_LETSENCRYPT=0
      # Nicht angemeldete Moderatoren werden zum Portal-Login geschickt.
      - TOKEN_AUTH_URL=https://${PORTAL_DOMAIN}/jitsi/auth?room={room}
      # Branding der Konferenzoberfläche
      - APP_NAME=${BRAND_NAME:-Verbandsgemeinde Otterbach-Otterberg}
      - NATIVE_APP_NAME=${BRAND_NAME:-Verbandsgemeinde Otterbach-Otterberg}
      - PROVIDER_NAME=${BRAND_NAME:-Verbandsgemeinde Otterbach-Otterberg}
      # Farben und Logo aus der Portal-Oberfläche (Admin > Design & Branding) in der Konferenz
      - DYNAMIC_BRANDING_URL=https://${MEET_DOMAIN}/branding/jitsi.json
    volumes:
      - ${CONFIG}/web:/config:Z
      - ${CONFIG}/web/crontabs:/var/spool/cron/crontabs:Z
    depends_on:
      - jvb

  prosody:
    <<: *jitsi-common
    image: jitsi/prosody:${JITSI_IMAGE_VERSION:-stable-11031}
    expose:
      - "5222"
      - "5347"
      - "5280"
    environment:
      - PORTAL_SECRET_KEY=
      - PORTAL_ADMIN_PASSWORD=
      # Räume ohne Anmeldung: Verbindungen ohne Token zulassen. Welche Räume trotzdem eine
      # Anmeldung verlangen (Portal-Räume) und wer aufnehmen darf, regeln die Portal-Module.
      - JWT_ALLOW_EMPTY=1
      - ENABLE_GUESTS=0
      - XMPP_MODULES=portal_access
      - XMPP_MUC_MODULES=portal_access_muc
    volumes:
      - ${CONFIG}/prosody/config:/config:Z
      - ${CONFIG}/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z
      - ./prosody/mod_portal_access.lua:/prosody-plugins-custom/mod_portal_access.lua:ro
      - ./prosody/mod_portal_access_muc.lua:/prosody-plugins-custom/mod_portal_access_muc.lua:ro
      # Liste der Portal-Räume (schreibt das Portal) und Chatprotokolle (schreibt Prosody)
      - ${CONFIG}/portal-rooms:/portal-rooms:ro
      - ${CONFIG}/portal-chat:/portal-chat
    networks:
      meet.jitsi:
        aliases:
          - ${XMPP_SERVER:-xmpp.meet.jitsi}

  jicofo:
    <<: *jitsi-common
    image: jitsi/jicofo:${JITSI_IMAGE_VERSION:-stable-11031}
    environment:
      - PORTAL_SECRET_KEY=
      - PORTAL_ADMIN_PASSWORD=
      - ENABLE_GUESTS=0
    volumes:
      - ${CONFIG}/jicofo:/config:Z
    depends_on:
      - prosody

  jvb:
    <<: *jitsi-common
    image: jitsi/jvb:${JITSI_IMAGE_VERSION:-stable-11031}
    environment:
      - PORTAL_SECRET_KEY=
      - PORTAL_ADMIN_PASSWORD=
    ports:
      - "${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp"
    volumes:
      - ${CONFIG}/jvb:/config:Z
    depends_on:
      - prosody

  jibri:
    <<: *jitsi-common
    image: jitsi/jibri:${JITSI_IMAGE_VERSION:-stable-11031}
    shm_size: "2gb"
    # Jibri braucht SYS_ADMIN für Chrome und das virtuelle Audiogerät; no-new-privileges verträgt sich nicht
    # mit dem sudo im Image, deshalb hier ohne.
    security_opt: []
    cap_add:
      - SYS_ADMIN
    environment:
      - PORTAL_SECRET_KEY=
      - PORTAL_ADMIN_PASSWORD=
      - DISPLAY=:0
      - JIBRI_RECORDING_DIR=/config/recordings
      - JIBRI_FINALIZE_RECORDING_SCRIPT_PATH=/config/finalize.sh
      # Jibri öffnet die eigene Konferenz-Adresse. Mit selbst signiertem Zertifikat würde Chrome
      # sonst abbrechen. Diese Option behält alle Standard-Flags von Jibri und ergänzt nur
      # --ignore-certificate-errors. NICHT CHROMIUM_FLAGS verwenden: das ersetzt alle Flags,
      # u. a. --autoplay-policy=no-user-gesture-required, und die Aufnahmen werden stumm.
      # Bei Let's Encrypt kann in .env JIBRI_IGNORE_CERTIFICATE_ERRORS=false gesetzt werden.
      - IGNORE_CERTIFICATE_ERRORS=${JIBRI_IGNORE_CERTIFICATE_ERRORS:-true}
      - CHROMIUM_FLAGS=
    volumes:
      - ${CONFIG}/jibri:/config:Z
      - ./jibri/finalize.sh:/config/finalize.sh:ro
      - ${CONFIG}/recordings:/config/recordings:Z
    # Jibri öffnet https://MEET_DOMAIN in Chrome. Damit das ohne Hairpin-NAT
    # klappt, zeigt die Domain im Container direkt auf den Host (Caddy).
    extra_hosts:
      - "${MEET_DOMAIN}:host-gateway"
    depends_on:
      - jicofo

  # Optional semantische Beschleunigung: nur Portal-Zugriff im isolierten Netz.
  # Kein Port am Host, kein öffentliches API, Vektoren nur flüchtig im tmpfs.
  # docker compose --profile rag up -d qdrant
  qdrant:
    image: qdrant/qdrant:v1.20.0
    profiles: ["rag"]
    restart: ${RESTART_POLICY:-unless-stopped}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "6333"
    tmpfs:
      - /qdrant/storage:size=536870912
    networks:
      rag_private:

  # Opt-in per COMPOSE_PROFILES=searxng (scripts/setup.sh).
  # Kein Host-Port: Nur das Portal spricht SearXNG über search_private an.
  # Separates Egress-Netz für die externen Suchmaschinen (internal-Netze allein
  # würden SearXNG den nötigen Internetzugriff sperren).
  searxng:
    image: ghcr.io/searxng/searxng:${SEARXNG_IMAGE_VERSION:-2026.11.5-3e95f6cd2}
    profiles: ["searxng"]
    restart: ${RESTART_POLICY:-unless-stopped}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Offizielles Image läuft ohne root. Keine Schreibversuche im config-Volume.
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
      - SEARXNG_PORT=8080
      - FORCE_OWNERSHIP=false
    expose:
      - "8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    networks:
      search_private:
      search_egress:
  # Optional offline OCR for Ortsrecht imports:
  # docker compose --profile ocr up -d --build law-ocr
  # No network, no portal DB/secrets, no published legal text access.
  law-ocr:
    build: ./portal/ocr_worker
    image: ${LAW_OCR_IMAGE:-takt-law-ocr:local}
    profiles: ["ocr"]
    restart: ${RESTART_POLICY:-unless-stopped}
    network_mode: "none"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 128
    tmpfs:
      - /tmp:size=134217728,mode=1777
    environment:
      - LAW_OCR_ORIGINALS=/work/originals
      - LAW_OCR_QUEUE=/work/queue
      - LAW_OCR_RESULTS=/work/results
    volumes:
      - ${CONFIG}/portal/law-ai-originals:/work/originals:ro
      - ${CONFIG}/portal/law-ai-ocr-queue:/work/queue
      - ${CONFIG}/portal/law-ai-ocr-results:/work/results

  portal:
    build: ./portal
    image: ${PORTAL_IMAGE:-jitsi-speechmind-portal:local}
    restart: ${RESTART_POLICY:-unless-stopped}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    environment:
      - TZ
      - PORTAL_BASE_URL=https://${PORTAL_DOMAIN}
      - MEET_BASE_URL=https://${MEET_DOMAIN}
      - PORTAL_SECRET_KEY
      - PORTAL_ADMIN_EMAIL
      - PORTAL_ADMIN_PASSWORD
      - BRAND_NAME=${BRAND_NAME:-Verbandsgemeinde Otterbach-Otterberg}
      - BRAND_PRODUCT=${BRAND_PRODUCT:-Videokonferenzserver}
      - JWT_APP_ID
      - JWT_APP_SECRET
      - JWT_ACCEPTED_AUDIENCES
      - JWT_TOKEN_TTL_MINUTES=${JWT_TOKEN_TTL_MINUTES:-240}
      - RECORDINGS_DIR=/recordings
      - DATA_DIR=/data
      - ACME_EMAIL
      - PUBLIC_IP=${JVB_ADVERTISE_IPS:-}
      - CADDY_CONF_DIR=/caddyconf
      - PORTAL_ROOMS_FILE=/portal-rooms/rooms.json
      - PORTAL_CHAT_DIR=/portal-chat
      # Nur dieser Schalter autorisiert die Verwendung des lokalen Suchdiensts.
      - TAKT_SEARXNG_ENABLED=${SEARXNG_ENABLED:-0}
    volumes:
      - ${CONFIG}/portal:/data
      # Proxy-Steuerung aus der Admin-Oberfläche: Konfiguration schreiben, Root-Zertifikat lesen
      # (Caddys Datenordner mit den privaten Schlüsseln bleibt bewusst außen vor)
      - ${CONFIG}/caddy/conf:/caddyconf
      # Zugriffsregeln für Prosody und Chatprotokolle aus Portal-Räumen
      - ${CONFIG}/portal-rooms:/portal-rooms
      - ${CONFIG}/portal-chat:/portal-chat
      - ${CONFIG}/recordings:/recordings
    networks:
      meet.jitsi:
      rag_private:
      search_private:

networks:
  meet.jitsi:
  rag_private:
    internal: true
  search_private:
    internal: true
  search_egress:

volumes:
  searxng_cache:
